name: thc-app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thc_user
      POSTGRES_PASSWORD: thc_secret
      POSTGRES_DB: thc_db
    volumes:
      - thc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thc_user -d thc_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: thc_user
      POSTGRES_PASSWORD: thc_secret
      POSTGRES_DB: thc_db
      PGHOST: db
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  thc_db_data:
