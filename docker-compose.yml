name: thc-app

services:
  db:
    image: postgres:16-alpine
    container_name: thc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thc_user} -d ${POSTGRES_DB:-thc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: thc-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thc_user}:${POSTGRES_PASSWORD:-thc_secret}@db:5432/${POSTGRES_DB:-thc_db}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: thc-frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
